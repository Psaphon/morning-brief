# Maps news entities to atrade's fixed universe.
# CROSS-REPO: this file must cover EXACTLY the symbols in atrade's config/universe.toml.
# Changing this file requires updating atrade's config/universe.toml in the same review.
# See docs/SIGNAL-SCHEMA.md §6.
#
# Matching rules:
#   - Aliases are matched case-insensitively on word boundaries (never raw substrings).
#   - Stock entries NEVER include the bare ticker symbol as an alias — V, MA, HD, PG etc.
#     are common English fragments that would fire constantly on unrelated text.
#   - Multi-word aliases are safer than single words; prefer "Home Depot" over "Depot".
#   - ETF aliases match the theme the ETF tracks, not the ticker, because news rarely
#     names an ETF ticker directly in a headline.

schema_version = "1.0.0"
universe_ref = "atrade/config/universe.toml@82c959e13d5d55f3b3871dbd496b39c023b57230"

# ---------------------------------------------------------------------------
# ETFs — 12 symbols
# Aliases match thematic keywords; see note above about not using bare tickers.
# ---------------------------------------------------------------------------

[[tickers]]
symbol = "SPY"
asset_class = "etf"
aliases = [
    "S&P 500", "S&P500", "SPDR S&P 500", "Standard & Poor's 500",
    "S&P index", "broad market rally", "broad market selloff",
]

