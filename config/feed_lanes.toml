# Feed lanes: where each feed's articles are used. Keyed by the feed name in
# docs/FEEDS.md. Valid lanes: reader (briefing + page), signals (per-ticker signals),
# rnd (stored only; never shown). Every active feed is listed so this file is auditable;
# tests/test_feed_lanes.py fails if a feed is missing. Per-host overrides: see
# interests.example.toml (MORNING_BRIEF_FEEDS_OVERLAY).

default = ["reader", "signals"]

[feeds."ProPublica"]
lanes = ["reader", "signals"]

