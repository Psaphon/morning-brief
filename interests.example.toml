# Example interests file for Morning Brief. Copy to
# ~/.config/morning-brief/interests.toml (or point $MORNING_BRIEF_INTERESTS at one or
# more files separated by ":"). Do not commit your real file.

# Optional: bullets whose article matches any keyword below show this label.
label = "On radar"

# term = weight (1-5). Case-insensitive, matched on word boundaries in the title plus
# the first 2,000 characters of the article. Scores are summed. If a keyword appears
# in several files, the highest weight wins.
[keywords]
kubernetes = 3
"open source" = 2
sqlite = 1
"data pipeline" = 4

# Per-feed gate: articles from this source (the stored `source` value) that score
# below min_interest are not summarized. Useful for high-volume feeds.
[feeds."Example Preprint Feed"]
min_interest = 2

# Feed lanes (reader / signals / rnd) are not set here: they live in config/feed_lanes.toml.
# To override them on this host, write ~/.config/morning-brief/feeds-overlay.toml (see
# $MORNING_BRIEF_FEEDS_OVERLAY) in the same shape, for example:
#
#   # Keep an existing feed out of the briefing and page, signals only:
#   [feeds."Example Preprint Feed"]
#   lanes = ["signals"]
#
#   # Add a feed that exists only on this host:
#   [feeds."Example Local Feed"]
#   url = "https://example.com/feed.xml"
#   category = "Tech"
#   lanes = ["reader"]
#
#   # Journalist-direct sources: kind is article (default), post or newsletter.
#   # A post feed (Bluesky/Mastodon profile RSS) with no lanes is reader-only.
#   [feeds."Example Reporter (Bluesky)"]
#   url = "https://bsky.example/profile/reporter.example/rss"
#   category = "Tech"
#   kind = "post"
#
#   [feeds."Example Newsletter"]
#   url = "https://newsletter.example/feed"
#   category = "Tech"
#   kind = "newsletter"
