name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ruff is PINNED deliberately. An unpinned install lets any upstream
      # release turn CI red with no change on our side — which is exactly what
      # happened on 2026-08-26, when 0.16.4 changed formatter output and
      # blocked an open PR that touched no Python at all.
      # Bump this deliberately, in its own PR, with the reformat it requires.
      - run: pip install ruff==0.15.7 pytest pytest-asyncio feedparser httpx trafilatura jinja2 rich click pyyaml
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --tb=short

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
