name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ruff is PINNED deliberately. An unpinned install lets any upstream
      # release turn CI red with no change on our side — which is exactly what
      # happened on 2026-08-26, when 0.16.4 changed formatter output and
      # blocked an open PR that touched no Python at all.
      # Bump this deliberately, in its own PR, with the reformat it requires.
      #
      # 0.15.7 -> 0.16.4 done that way. Note what 0.16 changed here: it began
      # formatting Python code blocks inside MARKDOWN, which is why this repo
      # broke on docs/GETTING-STARTED.md while siblings with the same explicit
      # `select` did not.
      #
      # Dependencies come from requirements.txt, the single source of truth. The
      # previous form hand-listed all nine packages here, a parallel list that had
      # to be edited by hand every time a dependency changed -- exactly the drift
      # that red-failed atrade PR #7 on 2026-09-01, where a test dep declared the
      # correct way was never installed by CI.
      #
      # requirements.txt floats ruff (>=0.8), so the pin is applied AFTER it and
      # wins. Keep these two steps in this order.
      - run: pip install -r requirements.txt
      - run: pip install ruff==0.16.4
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --tb=short

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
