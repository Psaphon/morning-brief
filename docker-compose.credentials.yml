# Override: pass the host's systemd credentials directory into the container, read-only.
#
# scripts/run-pipeline.sh adds this file (`-f docker-compose.yml -f
# docker-compose.credentials.yml`) only when "$CREDENTIALS_DIRECTORY/anthropic_api_key"
# exists on the host. The key stays a file: it is never an env var or in .env.
services:
  morning-brief:
    volumes:
      - ${CREDENTIALS_DIRECTORY}:/run/credentials:ro
    environment:
      - CREDENTIALS_DIRECTORY=/run/credentials
